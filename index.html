<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atajo IA</title>
<meta name="description" content="Tutoriales de inteligencia artificial en español que te ahorran tiempo.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --negro:#111318; --gris:#1B1E26; --amarillo:#FFD23F; --cian:#2EC4FF; --texto:#D5D8DE; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column;
    font-family:'Montserrat','Segoe UI',sans-serif; color:#fff;
    background:
      radial-gradient(ellipse 60% 50% at 70% 40%, rgba(46,196,255,.12), transparent 70%),
      radial-gradient(ellipse 50% 40% at 25% 60%, rgba(255,210,63,.08), transparent 70%),
      var(--negro);
  }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 16px; gap:28px; }
  img { width:140px; height:140px; border-radius:28px; }
  h1 { font-size:clamp(44px, 9vw, 84px); font-weight:900; letter-spacing:-.03em; line-height:1; }
  h1 span { color:var(--amarillo); }
  p { font-size:clamp(17px, 2.6vw, 22px); font-weight:600; color:var(--texto); max-width:640px; line-height:1.5; }
  p b { color:var(--cian); }
  .boton { display:inline-block; padding:14px 30px; border-radius:999px; background:var(--amarillo); color:var(--negro);
           font-weight:900; font-size:18px; text-decoration:none; letter-spacing:.02em; }
  .boton:hover { filter:brightness(1.08); }
  footer { padding:24px 16px; text-align:center; font-size:14px; color:rgba(255,255,255,.55); }
  footer a { color:rgba(255,255,255,.75); }
</style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Logo de Atajo IA: una tecla amarilla con las letras IA">
    <h1>Atajo <span>IA</span></h1>
    <p>Tutoriales de <b>inteligencia artificial</b> en español, claros y paso a paso, para que ahorres tiempo de verdad.</p>
    <a class="boton" href="https://www.youtube.com/@atajo_1a">Ver el canal en YouTube</a>
  </main>
  <footer>
    © Atajo IA · <a href="privacidad.html">Política de privacidad</a>
  </footer>
</body>
</html>
